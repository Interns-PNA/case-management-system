name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      backend_image: ${{ steps.meta.outputs.backend_image }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image metadata
        id: meta
        run: |
          base="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "backend_image=$base-backend" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$base-frontend" >> "$GITHUB_OUTPUT"
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — install, lint, build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Backend — syntax check
        run: node --check backend/server.js && node --check backend/config/db.js

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.backend_image }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=
          tags: |
            ${{ steps.meta.outputs.frontend_image }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.frontend_image }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sync MongoDB secret into Container App
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          az containerapp secret set \
            --name cms-backend \
            --resource-group rg-case-project \
            --secret-name mongo-uri \
            --value "$MONGO_URI" \
            --output none

      - name: Deploy backend
        run: |
          az containerapp update \
            --name cms-backend \
            --resource-group rg-case-project \
            --image "${{ needs.build.outputs.backend_image }}:${{ needs.build.outputs.image_tag }}" \
            --output none

      - name: Deploy frontend
        run: |
          az containerapp update \
            --name cms-frontend \
            --resource-group rg-case-project \
            --image "${{ needs.build.outputs.frontend_image }}:${{ needs.build.outputs.image_tag }}" \
            --output none

      - name: Wait for new revisions to run
        run: |
          for app in cms-backend cms-frontend; do
            echo "Waiting for $app..."
            rev=$(az containerapp show \
              --resource-group rg-case-project \
              --name "$app" \
              --query properties.latestRevisionName -o tsv)
            for i in $(seq 1 40); do
              state=$(az containerapp revision list \
                --resource-group rg-case-project \
                --name "$app" \
                --query "[?name=='$rev'].properties.runningState | [0]" -o tsv 2>/dev/null || echo "")
              echo "  $app ($rev): ${state:-unknown}"
              if [ "$state" = "Running" ]; then break; fi
              sleep 10
            done
          done

      - name: Smoke test (frontend → nginx proxy → backend → MongoDB)
        run: |
          fqdn=$(az containerapp show \
            --resource-group rg-case-project \
            --name cms-frontend \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "https://$fqdn"
          for i in $(seq 1 30); do
            if body=$(curl -fsS "https://$fqdn/health" 2>/dev/null); then
              echo "$body"
              echo "$body" | grep -q '"status":"ok"' && exit 0
            fi
            echo "attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Smoke test failed"
          exit 1
