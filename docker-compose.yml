# Local smoke-test of the containerized app.
#   1. cp .env.example .env   (set MONGO_URI)
#   2. docker compose up --build
#   3. open http://localhost:8080
services:
  backend:
    build: ./backend
    ports:
      - "5000:8080"
    environment:
      MONGO_URI: ${MONGO_URI:?Set MONGO_URI in .env (Atlas SRV, or mongodb://mongo:27017/case_management with --profile local)}
      PORT: "8080"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5173}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-admin1}
      NODE_ENV: production
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Same-origin: nginx proxies /api and /uploads to the backend
        VITE_API_BASE_URL: ""
    ports:
      - "8080:80"
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    restart: unless-stopped

  # Optional local MongoDB for offline testing:
  #   MONGO_URI=mongodb://mongo:27017/case_management docker compose --profile local up --build
  mongo:
    image: mongo:7
    profiles: ["local"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  uploads_data:
  mongo_data:
